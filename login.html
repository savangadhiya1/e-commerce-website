<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Volt Audio</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container { max-width: 800px; margin: 60px auto; padding: 20px; display: flex; gap: 30px; flex-wrap: wrap; }
        .auth-card { flex: 1; min-width: 300px; background: #1c1c1c; padding: 30px; border-radius: 10px; border: 1px solid #333; }
        .auth-card h2 { color: #ff4747; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #fff; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .auth-submit-btn { width: 100%; background: #ff4747; color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .auth-submit-btn:hover { background: #e03e3e; }
    </style>
</head>
<body>

<div class="top-offer-bar">
    <p>⚡ FLASH SALE: Premium Volt Audio gear up to 60% off! ⚡</p>
</div>

<header class="site-header">
    <div class="navbar-container">
        <a href="index.html" class="logo">volt</a>
        <nav class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="index.html">⚡ All Gear</a>
            <a href="gifting_store.html">🎁 Gifting Store</a>
        </nav>
        <div class="action-items">
            <a href="login.html" class="action-btn" title="Profile">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
            <a href="cart.html" class="action-btn cart-icon" title="View Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </div>
</header>

<main class="auth-container">
    <div class="auth-card">
        <h2>Customer Sign In</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="demo@voltgear.io" value="user@voltgear.io" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="••••••••" value="demo123" required>
            </div>
            <button type="submit" class="auth-submit-btn">Sign In to Volt</button>
        </form>
    </div>

    <div class="auth-card">
        <h2>New Customer?</h2>
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="regName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPass" placeholder="Create password" required>
            </div>
            <button type="submit" class="auth-submit-btn" style="background: #333;">Create Account</button>
        </form>
    </div>
</main>

<script src="assets/js/products.js"></script>
<script src="assets/js/cart.js"></script>
<script>
    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        localStorage.setItem('volt_user', JSON.stringify({ email: email, name: email.split('@')[0] }));
        showToast("Signed in successfully!");
        setTimeout(() => {
            window.location.href = "index.html";
        }, 800);
    }

    function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        localStorage.setItem('volt_user', JSON.stringify({ email: email, name: name }));
        showToast("Account created successfully!");
        setTimeout(() => {
            window.location.href = "index.html";
        }, 800);
    }
</script>
</body>
</html>
