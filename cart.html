<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Volt Audio</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f4f5f7; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .top-offer-bar { background-color: #eff4f8; color: #1a1a1a; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600; border-bottom: 1px solid #e3e9ed; }
        .site-header { background-color: #ffffff; position: sticky; top: 0; z-index: 99999; border-bottom: 1px solid #e3e9ed; padding: 0 5%; }
        .navbar-container { display: flex; align-items: center; justify-content: space-between; height: 80px; }
        .logo { font-size: 32px; font-weight: 900; color: #000; text-decoration: none; letter-spacing: -1px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #1a1a1a; text-decoration: none; font-size: 14px; font-weight: 600; }
        
        .cart-layout { display: flex; flex-wrap: wrap; gap: 30px; margin: 40px auto; max-width: 1100px; padding: 0 20px; }
        .cart-items-panel { flex: 2; min-width: 320px; background: #ffffff; border-radius: 12px; border: 1px solid #e3e9ed; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .cart-summary-panel { flex: 1; min-width: 280px; background: #ffffff; border-radius: 12px; border: 1px solid #e3e9ed; padding: 30px; height: fit-content; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .cart-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #eee; gap: 15px; }
        .cart-row:last-child { border-bottom: none; }
        .cart-img { width: 75px; height: 75px; object-fit: contain; border-radius: 8px; background: #f8f9fa; padding: 6px; }
        .qty-control { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
        .qty-btn { background: #f0f0f0; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; }
        .qty-val { padding: 6px 14px; font-size: 14px; font-weight: bold; background: #fff; }
        .del-btn { background: none; border: none; color: #ff4747; cursor: pointer; font-size: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 14px; color: #666; font-size: 15px; }
        .summary-total { font-size: 20px; font-weight: bold; color: #000; border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }
        .checkout-btn { width: 100%; background: #ff4747; color: #fff; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .checkout-btn:hover { background: #e03e3e; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal-box { background: #fff; border-radius: 12px; padding: 30px; width: 90%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="top-offer-bar">
    <p>⚡ FLASH SALE: Premium Volt Audio gear up to 60% off! ⚡</p>
</div>

<header class="site-header">
    <div class="navbar-container">
        <a href="index.html" class="logo">volt</a>
        <nav class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="index.html">⚡ All Gear</a>
            <a href="gifting_store.html">🎁 Gifting Store</a>
        </nav>
        <div style="font-weight: 600;">
            <a href="index.html" style="color: #ff4747; text-decoration: none;">← Continue Shopping</a>
        </div>
    </div>
</header>

<main class="cart-layout">
    <div class="cart-items-panel">
        <h2 style="margin-bottom: 25px; color: #1a1a1a;">Shopping Bag</h2>
        <div id="cartListContainer"></div>
    </div>

    <div class="cart-summary-panel">
        <h3 style="margin-bottom: 20px; color: #1a1a1a;">Price Details</h3>
        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotalVal">₹0</span>
        </div>
        <div class="summary-row">
            <span>Shipping</span>
            <span style="color: #00b894; font-weight: bold;">FREE</span>
        </div>
        <div class="summary-row" id="discountRow" style="display: none; color: #00b894; font-weight: bold;">
            <span>Coupon Discount</span>
            <span id="discountVal">-₹0</span>
        </div>
        <div class="summary-row summary-total">
            <span>Total Amount</span>
            <span id="totalVal">₹0</span>
        </div>

        <div style="margin-top: 25px; padding-top: 20px; border-top: 1px dashed #ddd;">
            <p style="font-size: 13px; color: #777; margin-bottom: 8px;">Promo Code: (Use <b>FREEVOLT</b>)</p>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="couponInput" placeholder="ENTER CODE" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase;">
                <button onclick="applyCouponCode()" style="background: #1a1a1a; color: #fff; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">Apply</button>
            </div>
            <div id="couponMsg" style="font-size: 13px; margin-top: 8px;"></div>
        </div>

        <button onclick="openCheckoutModal()" class="checkout-btn">⚡ Place Order</button>
    </div>
</main>

<div class="modal-overlay" id="checkoutModal">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0;">Delivery Details</h3>
            <span onclick="closeCheckoutModal()" style="cursor: pointer; font-size: 20px;">✕</span>
        </div>
        <form onsubmit="handlePlaceOrder(event)" style="display: flex; flex-direction: column; gap: 14px;">
            <input type="text" placeholder="Full Name" required style="padding: 12px; border: 1px solid #ccc; border-radius: 6px;">
            <input type="tel" placeholder="Mobile Number" required style="padding: 12px; border: 1px solid #ccc; border-radius: 6px;">
            <textarea placeholder="Delivery Address" required rows="3" style="padding: 12px; border: 1px solid #ccc; border-radius: 6px;"></textarea>
            <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; font-size: 14px;">
                Payment: <b>Cash on Delivery (Verified)</b>
            </div>
            <button type="submit" class="checkout-btn" style="margin-top: 5px;">Confirm Order</button>
        </form>
    </div>
</div>

<script>
    let discountPct = 0;

    function getCart() {
        try { return JSON.parse(localStorage.getItem('volt_cart')) || []; } catch(e) { return []; }
    }

    function saveCart(cart) {
        localStorage.setItem('volt_cart', JSON.stringify(cart));
        renderCart();
    }

    function renderCart() {
        const cart = getCart();
        const container = document.getElementById('cartListContainer');

        if (!cart || cart.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 50px 20px; color: #888;">
                    <div style="font-size: 48px; margin-bottom: 12px;">🛒</div>
                    <h3>Your bag is empty</h3>
                    <p style="margin: 10px 0 20px 0;">Add your favorite Volt audio gear to get started.</p>
                    <a href="index.html" style="background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px;">Shop Now</a>
                </div>
            `;
            document.getElementById('subtotalVal').textContent = '₹0';
            document.getElementById('totalVal').textContent = '₹0';
            document.getElementById('discountRow').style.display = 'none';
            return;
        }

        let subtotal = 0;
        container.innerHTML = cart.map(item => {
            const lineTotal = item.price * (item.quantity || 1);
            subtotal += lineTotal;
            const safeImg = encodeURI(item.image);
            return `
                <div class="cart-row">
                    <img src="${safeImg}" class="cart-img" onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500'">
                    <div style="flex: 1;">
                        <h4 style="margin: 0 0 5px 0;">${item.name}</h4>
                        <div style="color: #666; font-size: 14px;">₹${item.price.toLocaleString('en-IN')}</div>
                    </div>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span class="qty-val">${item.quantity || 1}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                    <div style="font-weight: bold; min-width: 80px; text-align: right;">
                        ₹${lineTotal.toLocaleString('en-IN')}
                    </div>
                    <button class="del-btn" onclick="removeItem(${item.id})" title="Delete">🗑</button>
                </div>
            `;
        }).join('');

        const discountAmt = Math.round((subtotal * discountPct) / 100);
        const finalTotal = Math.max(0, subtotal - discountAmt);

        document.getElementById('subtotalVal').textContent = `₹${subtotal.toLocaleString('en-IN')}`;
        document.getElementById('totalVal').textContent = `₹${finalTotal.toLocaleString('en-IN')}`;

        if (discountAmt > 0) {
            document.getElementById('discountRow').style.display = 'flex';
            document.getElementById('discountVal').textContent = `-₹${discountAmt.toLocaleString('en-IN')}`;
        } else {
            document.getElementById('discountRow').style.display = 'none';
        }
    }

    function updateQty(id, delta) {
        let cart = getCart();
        const item = cart.find(i => i.id === id);
        if (item) {
            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
            saveCart(cart);
        }
    }

    function removeItem(id) {
        let cart = getCart().filter(i => i.id !== id);
        saveCart(cart);
    }

    function applyCouponCode() {
        const val = document.getElementById('couponInput').value.trim().toUpperCase();
        const msg = document.getElementById('couponMsg');
        if (val === 'FREEVOLT') {
            discountPct = 20;
            msg.style.color = '#00b894';
            msg.textContent = '🎉 Coupon FREEVOLT applied! 20% Discount added.';
            renderCart();
        } else {
            msg.style.color = '#ff4747';
            msg.textContent = 'Invalid code. Try FREEVOLT';
        }
    }

    function openCheckoutModal() {
        if (getCart().length === 0) return alert("Your bag is empty!");
        document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeCheckoutModal() {
        document.getElementById('checkoutModal').style.display = 'none';
    }

    function handlePlaceOrder(e) {
        e.preventDefault();
        closeCheckoutModal();
        saveCart([]);
        alert("🎉 Order Confirmed!\n\nOrder ID: VOLT-" + Math.floor(100000 + Math.random() * 900000) + "\nThank you for checking out this showcase project!");
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (new URLSearchParams(window.location.search).get('coupon') === 'FREEVOLT') {
            document.getElementById('couponInput').value = 'FREEVOLT';
            applyCouponCode();
        }
        renderCart();
    });
</script>
</body>
</html>
